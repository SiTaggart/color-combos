name: Test and Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Increase watchers
        run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p
      - name: "Init: Install dependencies"
        run: bun install
      - name: "Build: Trigger build"
        run: bun run build
      - name: "Test: source"
        run: bun test
      - name: "Test: integration"
        run: bun test _test_/integration
      - name: "Lint & Format: Oxc"
        run: bun run lint && bun run format

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"
      - name: Clear auth token for OIDC
        run: echo "NODE_AUTH_TOKEN=" >> $GITHUB_ENV
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest
      - name: "Init: Install dependencies"
        run: bun install
      - name: "Build: Trigger build staging site"
        run: bun run build
      - name: "Publish: Trigger semantic release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run semantic-release
